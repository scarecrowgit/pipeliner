[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
gpui = "0.2.2"
anyhow = "1"
ui = { path = "crates/ui" }

[package]
name = "harness"
version = "0.1.0"
edition = "2024"
description = "Harness — agent pipeline editor demo (GPUI)"
license = "MIT"

[dependencies]
gpui.workspace = true
ui.workspace = true
sidebar = { path = "crates/sidebar" }
screen_editor = { path = "crates/screen_editor" }
screen_review = { path = "crates/screen_review" }
screen_chat = { path = "crates/screen_chat" }
screen_issues = { path = "crates/screen_issues" }
screen_agents = { path = "crates/screen_agents" }

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

# xattr 0.2.3 (pulled in by gpui_http_client) references libc::ENOATTR, which newer libc
# dropped on Linux. vendor/xattr is that release with the constant mapped to ENODATA.
[patch.crates-io]
xattr = { path = "vendor/xattr" }

[profile.release]
strip = "debuginfo"
