[workspace]
resolver = "2"
members = ["crates/core", "crates/engine", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2", features = ["json"] }
dirs = "5"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
glob = "0.3"
gpui = "0.2.2"
gpui-component = "=0.5.0"
gpui-component-assets = "=0.5.0"
async-channel = "2"
smol = "2"
harness-core = { path = "crates/core" }
harness-engine = { path = "crates/engine" }

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2
debug = 0

[profile.release]
opt-level = 3
lto = "thin"

# xattr 0.2.3 (pulled in by gpui_http_client -> zed-async-tar) uses libc::ENOATTR,
# which newer libc removed on Linux. Patched copy maps it to ENODATA.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
