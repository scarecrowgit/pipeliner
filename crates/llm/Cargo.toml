[package]
name = "llm"
version = "0.1.0"
edition = "2024"
description = "Provider-agnostic streaming LLM client (Anthropic Messages + OpenAI-compatible), blocking, gpui-free"

[dependencies]
anyhow.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
toml = "0.8"
